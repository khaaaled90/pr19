name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # يتيح لك تشغيل البناء يدوياً بنقرة زر من موقع GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تنزيل مكتبات المشروع
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء ملف الـ APK مع تجاوز التحقق من إصدارات Gradle القديمة
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 6. رفع ملف الـ APK الناتج لتتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
