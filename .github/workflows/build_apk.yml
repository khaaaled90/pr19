name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد بيئة Flutter (تعطيل الكاش لمنع استرجاع الملفات القديمة)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # 👈 تم تغييره إلى false لضمان عدم استخدام كاش قديم

      # 4. تنظيف كافة ملفات البناء والكاش القديمة
      - name: Clean Project
        run: flutter clean # 👈 خطوة التنظيف الصريحة

      # 5. تنزيل مكتبات المشروع من جديد
      - name: Install Dependencies
        run: flutter pub get

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 7. رفع ملف الـ APK الناتج
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
