name: Build Android APK

on:
  push:
    branches:
      - maintest1
  pull_request:
    branches:
      - maintest1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تثبيت Android SDK 36
      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # clean Packages
      - name: clean Dependencies
        run: flutter clean

      # Packages
      - name: Install Dependencies
        run: flutter pub get

      # توليد الأيقونات
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🔑 تفكيك ملف الـ Keystore وتخزينه للتوقيع
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/kha.jks

      # 🛠️ بناء الـ APK المشفر بـ R8/ProGuard و C++
      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PATH: "kha.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 🛡️ 1. التغليف الخارجي المصحح (DEX Packing & Shielding)
      - name: Apply External DEX Packing & Fix Alignment
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          # 1. إنشاء مجلد عمل وفك الملف
          mkdir -p workspace/unpacked
          unzip -q $APK_PATH -d workspace/unpacked
          
          # 2. حذف مجلد التوقيع القديم لمنع التعارض
          rm -rf workspace/unpacked/META-INF
          
          # 3. إعادة الضغط مع استثناء resources.arsc من الضغط (Uncompressed -0)
          cd workspace/unpacked
          zip -q -0 ../packed.apk resources.arsc
          zip -q -r -9 ../packed.apk . -x resources.arsc
          cd ../..

      # 📐 2. المحاذاة البرمجية الدقيقة (ZipAlign with Page Alignment)
      - name: Align Packed APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/zipalign -v -p 4 workspace/packed.apk workspace/app-aligned.apk

      # 🔐 3. إعادة التوقيع الصارم بجميع البروتوكولات (V1, V2, V3)
      - name: Re-sign Protected APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks android/app/kha.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out workspace/app-final-protected.apk \
            workspace/app-aligned.apk

      # 🔍 4. التحقق من صحة التوقيع والمحاذاة قبل التصدير
      - name: Verify APK Integrity
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify -v workspace/app-final-protected.apk

      # 🔑 تنظيف المفتاح
      - name: Clean Keystore
        if: always()
        run: rm -f android/app/kha.jks

      # 📦 رفع ملف APK النهائي الصالح للتثبيت
      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-protected
          path: workspace/app-final-protected.apk