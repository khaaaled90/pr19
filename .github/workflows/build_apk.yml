name: Build Android APK

on:
  push:
    branches:
      - maintest1
  pull_request:
    branches:
      - maintest1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract SHA-256 Key Fingerprint
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          keytool -list -v -keystore release.jks -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "SHA256:"
          rm release.jks
          
      # تثبيت Android SDK 36
      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      
      # clean Packages
      - name: clean Dependencies
        run: flutter clean
      
      # Packages
      - name: Install Dependencies
        run: flutter pub get
      
      # 🟢 أضف هذه الخطوة لتوليد الأيقونات على سيرفر GitHub تلقائياً
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --build-number=214

      # 🔑 1. تفكيك ملف الـ Keystore من GitHub Secrets وخزنه في مجلد android/app
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/kha.jks

      # 🛠️ 2. بناء الـ APK واستدعاء متغيرات البيئة للتوقيع
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PATH: "kha.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 🔑 3. تنظيف ملف الـ Keystore بعد انتهاء البناء للأمان
      - name: Clean Keystore
        if: always()
        run: rm -f android/app/kha.jks

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
