name: cardpay
description: "CardPay - Automated Wallet & Voucher Distribution App"
publish_to: 'none'

#version: 1.0.0+1
version: 1.0.0+382

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization & Formatting
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI & Charts
  fl_chart: ^0.68.0

  # File & Path Utilities
  file_picker: ^8.0.0
  excel: ^4.0.0
  syncfusion_flutter_pdf: ^33.2.13 # 👈 تم تحديث الإصدار لتجنب التعارض مع intl
  url_launcher: ^6.2.5              # 👈 تم فصل السطر بشكل صحيح
  path_provider: ^2.1.2
  path: ^1.8.3

  # Permissions & System
  permission_handler: ^11.3.0
  intent_plus: ^0.1.0
  flutter_contacts: ^1.1.9+2
  
  # Database
  sqflite: ^2.3.0

  # Notifications & Telephony
  flutter_local_notifications: ^17.0.0
  flutter_notification_listener: ^1.4.0
  another_telephony: ^0.4.0

  # 1. لجلب معلومات الجهاز وحساب Device ID
  device_info_plus: ^10.1.0
  crypto: ^3.0.3

  # 2. للتخزين المحلي المشفر لحماية الترخيص محلياً
  flutter_secure_storage: ^9.0.0

  # 3. للتشفير وفك تشفير الأكواد (AES)
  encrypt: ^5.0.3

  # 4. للاتصال والتزامن مع Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  connectivity_plus: ^6.0.0
  firebase_messaging: ^15.0.0  # 👈 أضف هذا السطر فقط
  firebase_remote_config: ^5.4.0 # أو أحدث إصدار
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# 🟢 إعدادات الأيقونة
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  app_name: "CardPay"
  
  min_sdk_android: 21 # أجهزة أندرويد المعززة
  
  # 🎯 أهم خطوة لإصلاح أيقونة شاشة الإعدادات في أندرويد
  adaptive_icon_background: "assets/background.png" # أو مسار صورة خلفية: "assets/background.png"
  adaptive_icon_foreground: "assets/icon_foreground.png" # الصورة الأمامية للأيقونة

flutter:
  uses-material-design: true

  # أزل التعليق عن هذا الجزء إذا أردت تضمين ملفات داخل التطبيق (مثل كروت/ملفات إكسل)
  # assets:
  #   - assets/